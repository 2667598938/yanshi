<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>研时 AI · 视觉动效演示</title>
<style>
/* 研时 AI · Neural Expressive。所有规则限定在AI空间，主题不会污染学习页。 */
.ai-wrap.neural {
  --n-bg:#101216; --n-text:#edf0f5; --n-sub:#b1b6c2; --n-faint:#929baa;
  --n-line:#ffffff18; --n-panel:#ffffff0f; --n-panel-strong:#ffffff19;
  --n-card:#ffffff10; --n-card-solid:#202329; --n-error:#ffb3b8;
  --n-grad:linear-gradient(110deg,#4285F4,#9B72CF 37%,#D65AC0 74%,#FBBC05);
  --n-ombre:linear-gradient(100deg,#a9c9ff,#d1b7f2 55%,#edb8dc);
  --n-ease:cubic-bezier(.2,0,0,1); --n-shimmer:cubic-bezier(.4,0,.6,1);
  --primary:#a9c9ff; --primary-grad:var(--n-grad); --ink:var(--n-text); --sub:var(--n-sub);
  --faint:var(--n-faint); --line:var(--n-line); --bg:var(--n-bg); --card:var(--n-card);
  --spectrum-opacity:.1; position:fixed; top:var(--notice-h,0px); left:0; right:0;
  bottom:calc(68px + env(safe-area-inset-bottom)); display:flex; min-width:0; overflow:hidden;
  isolation:isolate; color:var(--n-text); background:var(--n-bg); color-scheme:dark;
  font:400 15px/1.7 'Google Sans',Inter,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  transition:background-color 350ms var(--n-ease),color 350ms var(--n-ease);
}
.ai-wrap.neural.theme-light {
  --n-bg:#f7f8fb; --n-text:#252a34; --n-sub:#5b6370; --n-faint:#626c7d;
  --n-line:#1f293719; --n-panel:#ffffffb8; --n-panel-strong:#fffffff0;
  --n-card:#ffffffba; --n-card-solid:#fff; --n-error:#a12b3e; --primary:#315eaa;
  --n-ombre:linear-gradient(100deg,#315eaa,#784fa4 55%,#a43b88); color-scheme:light;
}
@media(prefers-color-scheme:light) { .ai-wrap.neural.theme-auto {
  --n-bg:#f7f8fb; --n-text:#252a34; --n-sub:#5b6370; --n-faint:#626c7d;
  --n-line:#1f293719; --n-panel:#ffffffb8; --n-panel-strong:#fffffff0;
  --n-card:#ffffffba; --n-card-solid:#fff; --n-error:#a12b3e; --primary:#315eaa;
  --n-ombre:linear-gradient(100deg,#315eaa,#784fa4 55%,#a43b88); color-scheme:light;
} }
.neural :where(button,a,input) { -webkit-tap-highlight-color:transparent; }
.neural button { font-family:inherit; cursor:pointer; }

.neural .sr-only { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; white-space:nowrap; }
.neural .neural-bg { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.neural .spectrum-flow { position:absolute; inset:-15%; opacity:.1;
  background:radial-gradient(ellipse at 20% 20%,#4285f4,transparent 43%),radial-gradient(ellipse at 82% 65%,#9b72cf,transparent 44%),radial-gradient(ellipse at 74% 90%,#d65ac0,transparent 38%),linear-gradient(150deg,transparent 60%,#fbbc0510);
  animation:neural-drift 32s var(--n-shimmer) infinite alternate; }
/* 尾部弥散；窄前缘指向焦点，位置仅随输入/生成/滚动/窗口变化更新。 */
.neural :is(.spectrum-tail,.spectrum-beam,.spectrum-focus) { position:absolute; left:var(--focus-x,50%); top:var(--focus-y,62%); transition:left 450ms var(--n-ease),top 450ms var(--n-ease),opacity 450ms var(--n-ease); }
.neural .spectrum-tail { width:550px; height:220px; transform:translate(-83%,-50%) rotate(-16deg); background:var(--n-grad); filter:blur(110px); opacity:var(--spectrum-opacity); }
.neural .spectrum-beam { width:260px; height:3px; transform:translate(-99%,-50%) rotate(-16deg); transform-origin:right center; background:linear-gradient(90deg,transparent,#4285f428 30%,#9b72cf88 65%,#d65ac0bb 91%,#fbbc05e6); clip-path:polygon(0 0,100% 40%,100% 60%,0 100%); opacity:calc(var(--spectrum-opacity)*2); }
.neural .spectrum-focus { width:100px; height:100px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle,#9b72cf60,transparent 70%); filter:blur(24px); opacity:var(--spectrum-opacity); }
.neural.state-listening { --spectrum-opacity:.19; }
.neural.state-thinking { --spectrum-opacity:.28; }
.neural.state-delivering { --spectrum-opacity:.16; }
.neural .ai-workspace { position:relative; display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; height:100%; }

.neural .empty-desc { font-size:14px; color:var(--n-sub); line-height:1.8; margin:14px auto 0; max-width:540px; }

/* 回答按文章排版，提问作为章节题目，不使用左右聊天气泡。 */
.neural .chat-msg { display:flex; gap:14px; max-width:820px; margin:0 auto 26px; }

@keyframes particle-think { 0%,100% { opacity:0; transform:translateY(3px); } 50% { opacity:.55; transform:translateY(-3px); } }
@keyframes stream-arrive { from { opacity:.2; top:3px; } to { opacity:1; top:0; } }
@keyframes answer-wash { 0% { opacity:0; background-position:110% 0; } 25% { opacity:1; } 100% { opacity:0; background-position:-100% 0; } }
@media(min-width:960px) {
  .app-main[data-view=ai] > .ai-wrap.neural { position:fixed; top:var(--notice-h,0px); left:var(--desktop-nav-w); right:0; bottom:0; width:auto; transform:none; max-width:none; border-radius:0; z-index:10; }
  .neural .ai-history-panel { display:block; width:220px; flex-shrink:0; padding:24px 12px; border-right:1px solid var(--n-line); background:var(--n-panel); overflow:auto; }
  .neural .ai-nav .nav-back,.neural .history-trigger { display:none; }
  .neural.is-empty .chat-scroll { display:flex; align-items:flex-end; justify-content:center; }
  .neural.is-empty .composer-dock { margin-bottom:clamp(32px,13vh,140px); }
  .neural .mask { align-items:center; padding:24px; }
  .neural .sheet { border-radius:28px; }
}
@media(max-width:959px) {
  .app-main[data-view=ai] > .ai-wrap.neural { left:0; right:0; width:100%; max-width:none; top:var(--notice-h,0px); bottom:auto; height:calc(var(--ai-visible-height,100dvh) - var(--notice-h,0px) - var(--ai-bottom-gap,68px)); transform:none; border-radius:0; }
  .app-main .neural .ai-nav,.neural .ai-nav { padding:10px 12px 6px; gap:4px; }
  .neural .nav-actions { gap:0; }
  .neural .nav-brand { gap:5px; }
  .neural .nav-brand > .brand-spark { display:none; }
  .neural .nav-sub { max-width:145px; font-size:10px; }
  .neural .nav-title { font-size:15px; }
  .neural :is(.icon-btn,.nav-back) { width:34px; height:38px; }
  .neural .scene-bar { flex-wrap:wrap; justify-content:flex-start; overflow:visible; padding:6px 12px 8px; }
  .neural .scene-chip { flex-shrink:0; font-size:11px; padding:6px 10px; }
  /* 移动端降低大面积磨砂成本；桌面仍保留更厚的玻璃质感。 */
  .neural .answer { backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
  .neural .composer { backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
  .neural .chat-scroll { padding:20px 16px; }
  .neural .chat-empty { padding:28px 6px; }
  .neural .empty-title { font-size:26px; }
  .neural .empty-desc { font-size:13px; }
  .neural .starter-list { margin-top:20px; }
  .neural .starter { max-width:none; width:100%; padding:12px 16px; }
  .neural .chat-msg { gap:7px; }
  .neural .msg-ava { display:none; }
  .neural .answer { padding:18px; border-radius:24px; }
  .neural .bubble { font-size:15px; }
  .neural .composer-dock { padding:0 14px max(12px,env(safe-area-inset-bottom)); }
  .neural .composer { padding:8px 9px 8px 18px; }
  .neural .composer-meta { margin:5px 10px; font-size:10px; }
  .neural .spectrum-tail { width:320px; height:150px; filter:blur(80px); }
  .neural .think-particles i:nth-child(n+4) { display:none; }
}
@media(max-height:540px) {
  .neural .empty-badge,.neural .empty-kicker { display:none; }
  .neural .chat-empty { padding:8px 0; }
  .neural .empty-title { font-size:23px; }
  .neural .starter-list { margin-top:14px; }
  .neural .starter:nth-child(n+2) { display:none; }
  .neural.is-empty .composer-dock { margin-bottom:0; }
  .neural .ai-guide { justify-content:flex-start; }
}
.neural.is-paused *,.neural.is-paused *::before,.neural.is-paused *::after { animation-play-state:paused !important; }
.neural.reduce-motion *,.neural.reduce-motion *::before,.neural.reduce-motion *::after { animation:none !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
@media(prefers-reduced-motion:reduce) { .neural *, .neural *::before, .neural *::after { animation:none !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
@media(forced-colors:active) { .neural .md strong { background:none; -webkit-text-fill-color:currentColor; } }
html.ai-neural-dark .desktop-nav { background:#17191e; border-color:#ffffff14; }
html.ai-neural-dark .desktop-brand { color:#edf0f5; }
html.ai-neural-dark .desktop-link { color:#aeb6c4; }
html.ai-neural-dark .desktop-link.active { background:#ffffff0d; color:#c0d3f4; }

*{box-sizing:border-box}body{margin:0;background:#101216}body .ai-wrap.neural.demo{inset:0;max-width:none;width:100%;height:100dvh;transform:none}.demo .demo-note{color:var(--n-faint);font-size:11px}.demo .demo-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.demo .demo-card{border:1px solid var(--n-line);border-radius:24px;padding:22px;background:var(--n-panel)}.demo .demo-card h4{margin:0 0 16px;font-size:14px;font-weight:500}.demo .demo-timeline{list-style:none;padding:0;margin:0}.demo .demo-timeline li{position:relative;padding:0 0 22px 18px;border-left:1px solid var(--n-line);font-size:13px}.demo .demo-timeline li:before{content:'';position:absolute;left:-3px;top:7px;width:5px;height:5px;border-radius:50%;background:#b69ed4}.demo .demo-timeline span{display:block;font-size:11px;color:var(--n-faint)}.demo .demo-bar{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;align-items:center;font-size:11px;margin:16px 0}.demo .demo-track{height:5px;background:var(--n-panel-strong);border-radius:6px}.demo .demo-track i{display:block;height:100%;background:linear-gradient(90deg,#638aca,#b6a0d3);border-radius:6px}.demo .demo-status{font-size:11px;color:var(--n-faint);padding:12px 0}.demo .simulate-btn{width:auto;padding:0 17px;font-size:12px}.demo .demo-actions{display:flex;gap:8px;align-items:center}.demo .theme-btn{font-size:12px;width:auto;padding:0 12px}.demo .chat-empty .starter{cursor:pointer}.demo .demo-response{white-space:pre-wrap}.demo .demo-response strong{font-weight:600;background:var(--n-ombre);background-clip:text;-webkit-text-fill-color:transparent}@media(max-width:600px){.demo .demo-card-grid{grid-template-columns:1fr}.demo .demo-note{max-width:140px;line-height:1.5}.demo .simulate-btn{padding:0 12px}.demo .nav-title{font-size:16px}}@media(max-height:540px){.demo .empty-desc{display:none}}
</style></head><body>
<main class="ai-wrap neural theme-dark state-idle is-empty demo" id="demo" aria-label="研时 AI 视觉演示">
  <div class="neural-bg" aria-hidden="true"><div class="spectrum-flow"></div><div class="spectrum-tail"></div><div class="spectrum-beam"></div><div class="spectrum-focus"></div></div>
  <div class="ai-workspace">
    <header class="ai-nav"><div class="nav-brand"><span class="brand-spark" aria-hidden="true"></span><div><div class="nav-title">研时 AI</div><div class="demo-note">视觉演示 · 示例内容，不读取账号数据</div></div></div><div class="demo-actions"><button class="icon-btn theme-btn" id="theme" type="button" aria-label="切换主题">深色</button><button class="icon-btn" id="reset" type="button" aria-label="重新开始">＋</button></div></header>
    <div class="scene-bar"><button class="scene-chip on" type="button">学习规划</button><span class="scene-chip">考研答疑</span><span class="scene-chip">学习复盘</span></div>
    <section class="chat-scroll" id="reading" aria-label="回答阅读区">
      <div class="chat-empty" id="welcome"><div class="empty-badge"><span class="brand-spark lg" aria-hidden="true"></span></div><div class="empty-kicker">研时 · YOUR NEXT UNDERSTANDING</div><h1 class="empty-title">把疑问，变成下一步。</h1><p class="empty-desc">理清一个知识点，安排一段好时光。<br>让每一次理解，都成为向前的力量。</p><div class="starter-list"><button class="starter" type="button">帮我规划明天的复习 ↗</button><button class="starter" type="button">怎么复盘一道数学错题？ ↗</button><button class="starter" type="button">专注一下午后怎样调整节奏？ ↗</button></div></div>
      <div id="result" hidden></div>
    </section>
    <div class="composer-dock"><div class="composer-meta"><span class="state-dot" id="dot"></span><span id="status" role="status">准备好了</span><span class="meta-spacer"></span><span>此页只演示动效，不连接模型</span></div><form class="composer" id="form"><input id="prompt" maxlength="4000" aria-label="输入演示问题" placeholder="输入一个问题，或直接模拟生成…" autocomplete="off"><button class="send-btn simulate-btn" id="generate" type="submit">模拟生成</button></form></div>
  </div>
</main>
<template id="answer-template"><article class="chat-msg assistant"><div class="msg-ava"><span class="brand-spark sm" aria-hidden="true"></span></div><div class="msg-main"><div class="bubble answer delivering"><div class="md demo-response" id="answer-text"></div><div class="demo-card-grid" id="details" hidden><section class="demo-card"><h4>明日节奏 · 示例时间线</h4><ol class="demo-timeline"><li><span>09:00 · 数学</span>75分钟，攻克一个核心题型</li><li><span>14:00 · 408</span>50分钟，理解并讲出知识框架</li><li><span>19:00 · 英语与错题</span>35分钟阅读，25分钟复盘</li></ol></section><figure class="demo-card" style="margin:0"><h4>专注分配 · 示例数据</h4><div class="demo-bar"><span>数学</span><div class="demo-track"><i style="width:100%"></i></div><span>75分</span></div><div class="demo-bar"><span>408</span><div class="demo-track"><i style="width:67%"></i></div><span>50分</span></div><div class="demo-bar"><span>英语</span><div class="demo-track"><i style="width:47%"></i></div><span>35分</span></div><figcaption class="demo-note">为说明版式而预置，不是你的学习统计。</figcaption></figure></div></div><p class="demo-status">演示回答不会保存，也不会生成系统任务。</p></div></article></template>
<script>
(() => {
  const root=document.getElementById('demo'), input=document.getElementById('prompt'), result=document.getElementById('result'), reading=document.getElementById('reading'), status=document.getElementById('status'), button=document.getElementById('generate');
  const motion=window.matchMedia?.('(prefers-reduced-motion: reduce)'), colors=window.matchMedia?.('(prefers-color-scheme: light)');
  let state='idle', generation=0, theme='dark', pending=null;
  const labels={idle:'准备好了',listening:'正在输入',thinking:'正在思考',delivering:'正在输出'};
  function focusPoint(){let target=state==='thinking'?root.querySelector('.thinking-row'):state==='delivering'?root.querySelector('.answer'):root.querySelector('.composer');if(!target)return;const a=root.getBoundingClientRect(),b=target.getBoundingClientRect();if(a.width&&a.height){root.style.setProperty('--focus-x',((b.left+b.width/2-a.left)/a.width*100)+'%');root.style.setProperty('--focus-y',Math.max(8,Math.min(92,(b.top+b.height/2-a.top)/a.height*100))+'%')}}
  // idle：进入/结束/清空；listening：聚焦或输入；thinking：提交后等待；delivering：示例文字开始输出。
  function setState(next){root.classList.remove('state-'+state);state=next;root.classList.add('state-'+state);status.textContent=labels[state];document.getElementById('dot').className='state-dot dot-'+state;focusPoint()}
  function wait(ms){return new Promise(resolve=>{pending={resolve,id:setTimeout(()=>{pending=null;resolve()},ms)}})}
  function cancel(){generation++;if(pending){clearTimeout(pending.id);pending.resolve();pending=null}button.textContent='模拟生成';setState(input.value.trim()?'listening':'idle')}
  function updateMotion(){root.classList.toggle('reduce-motion',!!motion?.matches)}
  async function simulate(){
    if(state==='thinking'||state==='delivering'){cancel();root.querySelector('.thinking-row')?.remove();root.querySelector('.answer')?.classList.remove('delivering');return}
    const owner=++generation, question=input.value.trim()||'帮我规划明天的复习';
    document.getElementById('welcome').hidden=true;result.hidden=false;root.classList.remove('is-empty');result.replaceChildren();
    const heading=document.createElement('div');heading.className='chat-msg user';const questionText=document.createElement('div');questionText.className='bubble';questionText.textContent=question;heading.append(questionText);result.append(heading);
    const thinking=document.createElement('div');thinking.className='thinking-row';thinking.setAttribute('role','status');thinking.innerHTML='<div class="think-spark"><span class="brand-spark"></span></div><div class="think-copy"><strong>正在整理思路</strong><p>即将展示预置示例，不连接模型…</p></div><div class="think-ripple"><i></i><i></i></div><div class="think-particles"><i></i><i></i><i></i></div>';
    result.append(thinking);input.value='';button.textContent='停止演示';setState('thinking');await wait(motion?.matches?80:1400);if(owner!==generation)return;
    thinking.remove();result.append(document.getElementById('answer-template').content.cloneNode(true));setState('delivering');
    const text='明天先完成两项最重要的任务，再给复盘留出余量。\n\n把“学完一章”缩小为一个能检查的成果：讲清一个知识点，独立做对一道题。每段专注结束后，留出真正的休息时间。\n\n你不需要把一天填满。稳稳完成，并知道自己为什么进步，就很好。';
    const output=document.getElementById('answer-text');let index=0;
    for(const char of text){if(owner!==generation)return;const span=document.createElement('span');span.textContent=char;if(!motion?.matches)span.className='stream-char';output.append(span);if(!motion?.matches&&++index%2===0)await wait(18);if(reading.scrollHeight-reading.scrollTop-reading.clientHeight<160)reading.scrollTop=reading.scrollHeight}
    if(owner!==generation)return;const first=text.indexOf('\n');const lead=document.createElement('strong');lead.textContent=text.slice(0,first);output.replaceChildren(lead,document.createTextNode(text.slice(first)));document.getElementById('details').hidden=false;root.querySelector('.answer').classList.remove('delivering');button.textContent='模拟生成';setState('idle');
  }
  document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();simulate()});
  input.addEventListener('focus',()=>{if(state==='idle')setState('listening')});input.addEventListener('input',()=>{if(state!=='thinking'&&state!=='delivering')setState('listening')});input.addEventListener('blur',()=>{if(state==='listening'&&!input.value.trim())setState('idle')});
  document.querySelectorAll('.starter').forEach(item=>item.addEventListener('click',()=>{input.value=item.textContent.replace(/ ↗$/,'');input.focus()}));
  document.getElementById('reset').addEventListener('click',()=>{cancel();input.value='';result.replaceChildren();result.hidden=true;document.getElementById('welcome').hidden=false;root.classList.add('is-empty');setState('idle')});
  document.getElementById('theme').addEventListener('click',event=>{root.classList.remove('theme-'+theme);theme=theme==='dark'?'light':theme==='light'?'auto':'dark';root.classList.add('theme-'+theme);event.currentTarget.textContent={dark:'深色',light:'浅色',auto:'跟随系统'}[theme]});
  window.addEventListener('resize',focusPoint);reading.addEventListener('scroll',focusPoint,{passive:true});motion?.addEventListener('change',updateMotion);document.addEventListener('visibilitychange',()=>root.classList.toggle('is-paused',document.hidden));window.addEventListener('pagehide',cancel,{once:true});
  updateMotion();focusPoint();
})();
</script></body></html>
