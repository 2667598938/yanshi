# 将example.com替换为实际域名，证书准备好后启用。
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    root /opt/yanshi/web/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/yanshi-security-headers.conf;
    }
    location /health {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/yanshi-security-headers.conf;
    }
    location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/yanshi-security-headers.conf; }
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/yanshi-security-headers.conf; }
    location /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; include /etc/nginx/snippets/yanshi-security-headers.conf; }
    location / { try_files $uri $uri/ /index.html; }
}
