# Include inside the EXISTING boang.fun HTTPS server block.
# Merge/replace its existing location /; do not create a second location /.
# Keep listen/server_name/ssl_certificate/Certbot challenge and renewal configuration.
client_max_body_size 8m;
location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 180s;
}
