worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 8m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $http_x_forwarded_proto $origin_scheme { default http; https https; }
    map $http_x_real_ip $origin_ip { "" $remote_addr; default $http_x_real_ip; }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/security-headers.conf;
        set $api_upstream http://api:8000;
        location ~ ^/api/v1/rooms/[0-9]+/media$ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $origin_ip;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_read_timeout 90s;
            proxy_buffering off;
            include /etc/nginx/security-headers.conf;
        }
        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $origin_ip;
            proxy_set_header X-Forwarded-For $origin_ip;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_buffering off;
            proxy_read_timeout 180s;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location /health {
            proxy_pass $api_upstream;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location = /sw.js {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
