<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研时 yanshi · 产品原型图（61 屏全量）</title>
<style>
:root{
  --bg:#FFF9EF; --surface:#FFF3E0; --surface2:#FAE7CE;
  --line:#F4E8D6; --line2:#EBDCC6;
  --t1:#2B2118; --t2:#6B5D4F; --t3:#A89880;
  --brand:#FF5A3C; --brandSoft:#FFE9DF; --brandDeep:#E2401F;
  --grad:linear-gradient(135deg,#FF7E52 0%,#FF5A3C 100%);
  --warn:#E09A2E; --red:#D93A20; --green:#1F8A48;
  --r:18px; --rs:12px; --pill:999px;
  --sh:0 1px 2px rgba(160,110,50,.04), 0 2px 8px rgba(160,110,50,.06);
  --sh2:0 3px 10px rgba(160,110,50,.08), 0 10px 28px rgba(160,110,50,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#EFE7DB;color:var(--t1);
 font-family:-apple-system,BlinkMacSystemFont,"Google Sans","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 padding:36px 26px 70px}
.board{display:flex;flex-wrap:wrap;gap:44px 30px;justify-content:center;max-width:1720px;margin:0 auto}
.ab{width:340px}
.ab.wide{width:720px}
.ab.wide .screen{width:720px;height:470px;border-radius:16px}
.ab .lb{display:flex;align-items:baseline;gap:7px;margin-bottom:8px;padding-left:3px}
.ab .lb b{font-size:12.5px;font-weight:600;color:#3C4043}
.ab .lb span{font-size:10px;color:#9AA0A6}
.screen{width:340px;height:736px;background:var(--bg);border-radius:24px;overflow:hidden;position:relative;
 box-shadow:0 1px 3px rgba(150,100,40,.08),0 12px 32px rgba(150,100,40,.12);display:flex;flex-direction:column;border:1px solid rgba(220,200,170,.6)}

/* 状态栏 */
.st{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:11px;
 font-weight:600;color:var(--t1);flex:none;height:32px}
.st .r{display:flex;gap:4px;align-items:center}
.sg{display:flex;gap:1.5px;align-items:flex-end}.sg i{width:2.5px;background:currentColor;border-radius:1.5px;display:block}
.bt{width:18px;height:9px;border:1.1px solid currentColor;border-radius:2.5px;position:relative;opacity:.85}
.bt::after{content:"";position:absolute;right:-2.5px;top:2px;width:1.6px;height:3.5px;background:currentColor;border-radius:0 1px 1px 0}
.bt i{position:absolute;left:1px;top:1px;bottom:1px;width:10px;background:currentColor;border-radius:1px}
.bd{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pad{padding:0 22px}

/* 顶栏 */
.nb{display:flex;align-items:center;gap:10px;padding:6px 22px 14px}
.nb h2{font-size:23px;font-weight:800;letter-spacing:-.5px;flex:1}
.nb .ac{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ib svg{width:19px;height:19px;stroke:var(--t1);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib.f{background:var(--surface)}
.dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid #fff}

/* 文本 */
.h1{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.35}
.h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:500}
.h1 em{font-style:normal;font-weight:500}
.sub{font-size:12.5px;color:var(--t2);margin-top:7px;line-height:1.6}
.sttl{font-size:16px;font-weight:800;color:var(--t1);padding:18px 22px 9px;display:flex;align-items:baseline}
.sttl b{font-weight:500;flex:1}
.sttl span{font-size:11.5px;color:var(--t3);font-weight:400}

/* 卡片 */
.cd{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.cd.f{background:var(--surface);box-shadow:none}
.cd.b{box-shadow:none;border:1px solid var(--line)}
.mb{margin-bottom:12px}

/* 列表行 */
.rw{display:flex;align-items:center;gap:13px;padding:12px 0}
.rw+.rw{border-top:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:19px;height:19px;stroke:var(--brand);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.a{background:var(--brandSoft)}.ic.b2{background:#FFF4DC}
.ic.b2 svg{stroke:#B06000}.ic.c{background:#E8F6EC}.ic.c svg{stroke:var(--green)}
.ic.d{background:#F7EAFB}.ic.d svg{stroke:#8430CE}.ic.e{background:#FFEBE6}.ic.e svg{stroke:var(--red)}
.rc{flex:1;min-width:0}
.rc .t{font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rc .t em{font-style:normal;font-size:11.5px;color:var(--t3);font-weight:400}
.rc .d{font-size:11.5px;color:var(--t3);margin-top:3px;line-height:1.5}
.ar{color:#DADCE0;font-size:14px;flex:none}

/* 标签 */
.tg{font-size:10.5px;padding:2.5px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.tg.bl{background:var(--brandSoft);color:var(--brandDeep)}
.tg.gn{background:#E6F4EA;color:var(--green)}
.tg.yl{background:#FEF7E0;color:#B06000}
.tg.rd{background:#FCE8E6;color:var(--red)}
.tg.gy{background:var(--surface2);color:var(--t2)}

/* 按钮 */
.bt1{height:48px;border-radius:var(--rs);background:var(--grad);color:#fff;display:flex;align-items:center;
 justify-content:center;font-size:14.5px;font-weight:600;box-shadow:0 3px 12px rgba(240,81,47,.28)}
.bt1.gd{background:var(--grad);box-shadow:0 1px 3px rgba(66,133,244,.3)}
.bt2{height:48px;border-radius:var(--rs);background:var(--surface);color:var(--brand);display:flex;
 align-items:center;justify-content:center;font-size:14.5px;font-weight:500}
.bt3{height:44px;border-radius:var(--rs);background:var(--brandSoft);color:var(--brandDeep);
 display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500}
.row2{display:flex;gap:10px}.row2>*{flex:1}

/* 输入 */
.fd{height:50px;border-radius:var(--rs);background:var(--surface);display:flex;align-items:center;
 padding:0 15px;font-size:13.5px;color:var(--t3);margin-bottom:9px;gap:8px}
.fd .l{margin-left:auto;font-size:12.5px;color:var(--brand);font-weight:500}
.fd.on{background:#fff;box-shadow:0 0 0 2px var(--brandSoft)}

/* 分段 */
.seg{display:flex;gap:2px;background:var(--surface);border-radius:10px;padding:3px}
.seg div{flex:1;text-align:center;font-size:12.5px;padding:7px 0;border-radius:8px;color:var(--t2)}
.seg div.on{background:#fff;color:var(--brandDeep);font-weight:600;box-shadow:0 1px 3px rgba(160,110,50,.14)}

/* 数据 */
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgc{background:var(--surface);border-radius:14px;padding:13px 6px;text-align:center}
.sgc .n{font-size:19px;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.sgc .n s{font-size:10.5px;color:var(--t3);text-decoration:none;margin-left:1px}
.sgc .l{font-size:10.5px;color:var(--t3);margin-top:2px}
.big{font-size:33px;font-weight:700;letter-spacing:-1.2px}
.big s{font-size:15px;color:var(--t3);text-decoration:none;margin-left:2px}

/* 热力图 */
.heat{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:#F1F3F4;display:block}
.heat i.l1{background:#C6E7CE}.heat i.l2{background:#8FD6A2}.heat i.l3{background:#4CAF6E}.heat i.l4{background:#1E8E3E}
.lg{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:9.5px;color:var(--t3)}
.lg i{width:8px;height:8px;border-radius:2px;display:block}

/* 底部 tab */
.tb{flex:none;height:66px;border-top:1px solid var(--line);display:flex;background:#fff;position:relative}
.tb .it{flex:1;text-align:center;font-size:9.5px;color:var(--t3);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;padding-top:6px}
.tb .it svg{width:21px;height:21px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .it.on{color:var(--brand);font-weight:600}
.tb .it.on svg{stroke:var(--brand)}
.tb .mid{padding-top:0;margin-top:-24px}
.tb .mid .mbb{width:52px;height:52px;border-radius:50%;border:3.5px solid #fff;
 background:radial-gradient(circle at 32% 26%,#FF9B78,#F0512F 62%,#D23F1E);
 display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #C23A22,0 8px 18px rgba(200,60,20,.32)}
.tb .mid .mbb svg{width:24px;height:24px;stroke:#fff}

/* 头像 */
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none}
.av svg{width:100%;height:100%;display:block}

/* 番茄环 */
.ring{display:flex;justify-content:center;position:relative;padding:6px 0}
.ring svg{width:212px;height:212px;transform:rotate(-90deg)}
.ring .tk{fill:none;stroke:var(--surface2);stroke-width:10}
.ring .pg{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round}
.rc2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.rc2 .t{font-size:44px;font-weight:300;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.rc2 .s{font-size:11.5px;color:var(--t3);margin-top:6px}
.rc2 .g{display:inline-block;margin-top:10px;font-size:11px;padding:3px 10px;border-radius:var(--pill);
 background:var(--brandSoft);color:var(--brandDeep);font-weight:500}

/* AI */
.aig{background:radial-gradient(120% 85% at 50% 112%,#E8EDFB 0%,#F6F7FB 42%,#fff 78%)}
.starw{display:flex;justify-content:center;padding:20px 0 6px}
.bub{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.65;margin-bottom:9px}
.bub.me{margin-left:auto;background:var(--brandSoft);color:var(--t1);border-bottom-right-radius:5px}
.bub.ai{background:var(--surface);border-bottom-left-radius:5px}
.ab2{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:var(--pill);
 padding:8px 8px 8px 16px;margin:0 18px}
.ab2 span{flex:1;font-size:13px;color:var(--t3)}
.ab2 .sd{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center}
.ab2 .sd svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}

/* 黑金 VIP */
.vipbd{background:#121212;flex:1;display:flex;flex-direction:column}
.vh{margin:4px 18px 0;border-radius:20px;padding:22px 20px;position:relative;overflow:hidden;
 background:linear-gradient(150deg,#3A3428 0%,#1A1712 62%);border:1px solid #3C3527}
.vh::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-66px;
 background:radial-gradient(circle,rgba(240,214,150,.2),transparent 68%)}
.vh .a{font-size:20px;font-weight:500;color:#fff}
.vh .b{font-size:11px;color:#D9C08A;margin-top:7px}
.vh .c{display:inline-block;margin-top:16px;background:#0A0A0A;border:1px solid #B9974E;color:#fff;
 font-size:12.5px;font-weight:500;padding:9px 17px;border-radius:var(--pill)}
.vh .d{position:absolute;right:16px;top:24px;font-size:23px;font-weight:600;line-height:1.1;text-align:right;
 background:linear-gradient(180deg,#FBEBC2,#C9A252);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vt{text-align:center;font-size:16px;font-weight:500;margin:20px 0 12px;
 background:linear-gradient(180deg,#FBEBC2,#C9A252);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* 管理后台 */
.mtbl{background:#fff;border-radius:var(--rs);overflow:hidden;box-shadow:var(--sh)}
.mtr{display:flex;align-items:center;gap:9px;padding:11px 12px;font-size:11.5px}
.mtr+.mtr{border-top:1px solid var(--line)}
.mth{background:var(--surface);font-size:10.5px;color:var(--t3);font-weight:500}
</style>
</head>
<body>
<div class="board" id="board"></div>

<script>
const I={
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7.5h7M8 11h5"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.5-5.2 5.5-5.2s5.5 2 5.5 5.2"/><path d="M16 5.4a3.2 3.2 0 0 1 0 6.2"/>',
 box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/>',
 star:'<path d="M12 3.5 13.8 9l5.5 1.8-5.5 1.8L12 18l-1.8-5.4L4.7 10.8 10.2 9z"/>',
 home:'<path d="M3 11.2 12 3.5l9 7.7V20a1.5 1.5 0 0 1-1.5 1.5H15V15H9v6.5H4.5A1.5 1.5 0 0 1 3 20z"/>',
 me:'<circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/>',
 bell:'<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.3 19a2 2 0 0 0 3.4 0"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 lock:'<rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
 file:'<path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/>',
 key:'<circle cx="8" cy="12" r="4"/><path d="m12 12 8-8M17 6l2 2M15 8l2 2"/>',
 shield:'<path d="M12 3l7.5 3v6c0 4.5-3.2 7.9-7.5 9-4.3-1.1-7.5-4.5-7.5-9V6z"/>',
 gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12.5h18M12 8v13"/><path d="M12 8S9.5 8 8.3 6.8A2.4 2.4 0 0 1 12 4a2.4 2.4 0 0 1 3.7 2.8C14.5 8 12 8 12 8z"/>',
 chat:'<path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4.5 20l1.2-4.3A7.5 7.5 0 1 1 20 12z"/>',
 heart:'<path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.7C19 15.6 12 20 12 20z"/>',
 camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
 fire:'<path d="M12 3s5 4.2 5 8.6a5 5 0 0 1-10 0C7 9 9 7.4 9 7.4s.3 2.2 1.6 2.2C12.4 9.6 12 3 12 3z"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 2"/>',
 check:'<path d="m5 13 4.5 4.5L19 7"/>',
 edit:'<path d="M4 20h4l11-11-4-4L4 16z"/><path d="M14 5l4 4"/>',
 send:'<path d="M4 12l16-7-6.5 16-2.6-6.9z"/>',
 mic:'<rect x="9.5" y="3" width="5" height="10" rx="2.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
 cloud:'<path d="M7 18a4 4 0 0 1-.5-7.97A5 5 0 0 1 16 9.5a3.5 3.5 0 0 1 .5 8.5z"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m3 16 5-4 5 4 3-2.5 5 4"/>',
 rule:'<path d="M4 6h16M4 12h10M4 18h7"/>',
 award:'<circle cx="12" cy="14" r="5"/><path d="M8.5 3.5 11 9M15.5 3.5 13 9"/>',
 user2:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/>',
 wx:'<path d="M9 4C5 4 2 6.6 2 9.9c0 1.8 1 3.4 2.6 4.5L4 17l2.6-1.3"/><path d="M15 8c3.3 0 6 2.2 6 5s-2.7 5-6 5c-.6 0-1.2-.1-1.7-.2L11 19l.5-1.8C10 16.3 9 14.7 9 13c0-2.8 2.7-5 6-5z"/>',
 qq:'<path d="M12 3c-4 0-7 2.7-7 6 0 2 1 3.7 2.6 4.8L7 16l3-1.2c.6.1 1.3.2 2 .2s1.4-.1 2-.2L17 16l-.6-2.2C18 12.7 19 11 19 9c0-3.3-3-6-7-6z"/>',
 phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 5h4"/>'
};
const sv=n=>`<svg viewBox="0 0 24 24">${I[n]||''}</svg>`;
const st=()=>`<div class="st"><span>9:41</span><div class="r">
 <span class="sg"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>
 <span class="bt"><i></i></span></div></div>`;
const nb=(t,acts,dark)=>`<div class="nb"${dark?' style="color:#fff"':''}>
 <h2${dark?' style="color:#fff"':''}>${t}</h2><div class="ac">${(acts||[]).map(a=>`<div class="ib f">${sv(a)}</div>`).join('')}</div></div>`;
const tb=on=>`<div class="tb">
 ${[['home','首页'],['book','错题']].map((x,i)=>`<div class="it ${on===i?'on':''}">${sv(x[0])}<span>${x[1]}</span></div>`).join('')}
 <div class="it mid ${on===2?'on':''}"><div class="mbb">${sv('timer')}</div><span>专注</span></div>
 ${[['users','自习室'],['me','我的']].map((x,i)=>`<div class="it ${on===3+i?'on':''}">${sv(x[0])}<span>${x[1]}</span></div>`).join('')}
</div>`;
const av=i=>{const P=[['#E8F0FE','#3D3226','#1A73E8'],['#FEF7E0','#5A3A2E','#E8A33D'],['#E6F4EA','#2B2B33','#1E8E3E'],
 ['#F3E8FD','#8B5E3C','#8430CE'],['#FCE8E6','#4A4A55','#D93025'],['#E0F7FA','#6B4A3A','#00838F']][i%6];
 return `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="${P[0]}"/>
 <path d="M7 64c0-13 11-20 25-20s25 7 25 20z" fill="${P[2]}"/>
 <circle cx="32" cy="30" r="15" fill="#FFE3C8"/>
 <path d="M17 29a15 15 0 0 1 30 0v-2c0-8-6.7-13-15-13s-15 5-15 13z" fill="${P[1]}"/>
 <circle cx="26" cy="31" r="1.9" fill="#3A3226"/><circle cx="38" cy="31" r="1.9" fill="#3A3226"/>
 <path d="M29.4 37.4q2.6 2.4 5.2 0" stroke="#3A3226" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;};

const S=[];
/* 1 登录 */
S.push(['01 登录','邮箱验证码 + 三方入口（灰显）',`${st()}
<div class="bd"><div class="pad" style="padding-top:18px">
 <div style="width:52px;height:52px;border-radius:15px;background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-size:23px;font-weight:500;color:#fff;box-shadow:0 4px 14px rgba(66,133,244,.3)">研</div>
 <div class="h1" style="margin-top:22px">用 <b>研时</b> 开始<br>今晚的专注</div>
 <div class="sub">断网也能记番茄、刷错题<br>联网后自动同步，数据不丢</div>
 <div style="margin-top:30px"><div class="fd on">QQ 邮箱</div>
  <div class="fd">6 位验证码<span class="l">获取验证码</span></div>
  <div class="bt1 gd" style="margin-top:4px">登录 / 注册</div></div>
 <div style="display:flex;align-items:center;gap:10px;padding:26px 0 0">
  <i style="flex:1;height:1px;background:var(--line)"></i><span style="font-size:11px;color:var(--t3)">其他方式</span>
