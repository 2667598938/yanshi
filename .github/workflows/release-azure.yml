name: Build and release Azure images
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: yanshi-production-release
  cancel-in-progress: false
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit resolved Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r server/requirements.lock --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit frontend lockfile
        working-directory: web
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - id: release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$SHA" ]] || { echo 'A newer main commit exists; do not release this stale run.' >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb4685202752c5c67727a062f6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/azure/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/2667598938/yanshi-api:${{ steps.release.outputs.sha }}-${{ github.run_id }}
            ghcr.io/2667598938/yanshi-api:main
          labels: org.opencontainers.image.source=https://github.com/2667598938/yanshi
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/azure/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/2667598938/yanshi-web:${{ steps.release.outputs.sha }}-${{ github.run_id }}
            ghcr.io/2667598938/yanshi-web:main
          labels: org.opencontainers.image.source=https://github.com/2667598938/yanshi
      - name: Record immutable release identities
        env:
          SHA: ${{ steps.release.outputs.sha }}
          API: ${{ steps.api.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          printf 'Commit: `%s`\n\nAPI: `%s`\n\nWeb: `%s`\n' "$SHA" "$API" "$WEB" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: Azure/login@7184910d9eb2b1c5e48f7063196f09bb9f6d6 # v2, verified 2026-10-29
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Release through Azure VM agent
        env:
          SHA: ${{ needs.images.outputs.sha }}
          API: ${{ needs.images.outputs.api }}
          WEB: ${{ needs.images.outputs.web }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$API" =~ ^sha256:[0-9a-f]{64}$ && "$WEB" =~ ^sha256:[0-9a-f]{64}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$SHA" ]] || { echo 'Main advanced; do not deploy this stale run.' >&2; exit 1; }
          result=$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts "/usr/local/sbin/yanshi-deploy '$SHA' '$API' '$WEB'" --query 'value[0].message' -o tsv)
          printf '%s\n' "$result"
          grep -Fqx "YANSHI_DEPLOY_OK $SHA" <<< "$result"
