name: Build and release Azure images
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: yanshi-production-release
  cancel-in-progress: false
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24; verified 2026-10-29
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24; verified 2026-10-29
        with:
          python-version: '3.12'
      - name: Audit resolved Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r server/requirements.lock --progress-spinner off
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24; verified 2026-10-29
        with:
          node-version: '22'
      - name: Audit frontend lockfile
        working-directory: web
        run: npm audit --registry=https://registry.npmjs.org
      - id: release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$SHA" ]] || { echo 'A newer main commit exists; do not release this stale run.' >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node 24; verified 2026-10-29
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0, Node 24; verified 2026-10-29
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node 24; verified 2026-10-29
        with:
          context: .
          file: deploy/azure/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/2667598938/yanshi-api:${{ steps.release.outputs.sha }}-${{ github.run_id }}
          labels: org.opencontainers.image.source=https://github.com/2667598938/yanshi
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node 24; verified 2026-10-29
        with:
          context: .
          file: deploy/azure/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/2667598938/yanshi-web:${{ steps.release.outputs.sha }}-${{ github.run_id }}
          labels: org.opencontainers.image.source=https://github.com/2667598938/yanshi
      - name: Record immutable release identities
        env:
          SHA: ${{ steps.release.outputs.sha }}
          API: ${{ steps.api.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          printf 'Commit: `%s`\n\nAPI: `%s`\n\nWeb: `%s`\n' "$SHA" "$API" "$WEB" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0, Node 24; verified 2026-10-29
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Release through Azure VM agent
        env:
          SHA: ${{ needs.images.outputs.sha }}
          API: ${{ needs.images.outputs.api }}
          WEB: ${{ needs.images.outputs.web }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$API" =~ ^sha256:[0-9a-f]{64}$ && "$WEB" =~ ^sha256:[0-9a-f]{64}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$SHA" ]] || { echo 'Main advanced; do not deploy this stale run.' >&2; exit 1; }
          result=$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts "/usr/local/sbin/yanshi-deploy '$SHA' '$API' '$WEB'" --query 'value[0].message' -o tsv)
          printf '%s\n' "$result"
          grep -Fqx "YANSHI_DEPLOY_OK $SHA" <<< "$result"
