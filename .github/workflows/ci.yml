name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: 安装依赖
        run: pip install --require-hashes -r requirements.lock

      - name: 后端依赖安全审计
        run: |
          pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off

      - name: 校验数据库迁移
        env:
          DATABASE_URL: sqlite:///./ci.sqlite
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: 运行测试
        run: python -m pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 前端回归测试
        run: npm test

      - name: 前端依赖安全审计
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: 构建
        run: npm run build

  deployment:
    name: Linux容器部署验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 构建镜像并验证生产路径
        run: bash deploy/azure/ci-smoke.sh
