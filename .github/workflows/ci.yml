name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24; verified 2026-10-29

      - name: 安装 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24; verified 2026-10-29
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: 安装依赖
        run: pip install --require-hashes -r requirements.lock

      - name: 后端依赖安全审计
        run: |
          pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off

      - name: 校验数据库迁移
        env:
          DATABASE_URL: sqlite:///./ci.sqlite
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: 运行测试
        run: python -m pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24; verified 2026-10-29

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24; verified 2026-10-29
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 前端回归测试
        run: npm test

      - name: 前端依赖安全审计
        run: npm audit --registry=https://registry.npmjs.org

      - name: 构建
        run: npm run build

  deployment:
    name: Linux容器部署验收
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24; verified 2026-10-29
      - name: 构建镜像并验证生产路径
        run: bash deploy/azure/ci-smoke.sh
